<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karakılıç Otomotiv & İnşaat</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="landing-body">

    <!-- LOGO / HEADER -->
    <header class="landing-header">

        <img
            src="assets/logo.png"
            alt="Karakılıç Otomotiv & İnşaat"
            class="landing-logo"
        >

    </header>


    <!-- ANA SEÇİM EKRANI -->
    <main class="business-selector">

        <!-- OTOMOTİV -->
        <a href="otomotiv.html" class="business-card automotive-card">

            <div class="business-overlay"></div>

            <div class="business-content">

                <span class="business-number">01</span>

                <h1>OTOMOTİV</h1>

                <p>
                    Güvenilir ikinci el araç alım ve satım hizmetleri.
                </p>

                <span class="explore-button">
                    KEŞFET
                    <span class="arrow">→</span>
                </span>

            </div>

        </a>


        <!-- İNŞAAT -->
        <a href="insaat.html" class="business-card construction-card">

            <div class="business-overlay"></div>

            <div class="business-content">

                <span class="business-number">02</span>

                <h1>İNŞAAT</h1>

                <p>
                    Konut ve ticari yapı projelerinde profesyonel çözümler.
                </p>

                <span class="explore-button">
                    KEŞFET
                    <span class="arrow">→</span>
                </span>

            </div>

        </a>

    </main>


    <!-- FOOTER -->
    <footer class="landing-footer">

        <p>
            © 2026 Karakılıç Otomotiv & İnşaat
        </p>

    </footer>

</body>
</html>
